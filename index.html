<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#020812;color:#9fe8ff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
.core{width:96px;height:96px;margin:18px auto 8px;border-radius:50%;border:3px solid #19d3ff;box-shadow:0 0 30px #19d3ff,inset 0 0 25px #19d3ff;animation:p 2.5s infinite}
@keyframes p{50%{box-shadow:0 0 55px #19d3ff,inset 0 0 40px #19d3ff}}
@media(prefers-reduced-motion:reduce){.core{animation:none}}
h1{text-align:center;font-size:15px;letter-spacing:4px;margin:0;font-weight:400}
#log{flex:1;overflow:auto;padding:10px}
.m{margin:6px 0;padding:8px 10px;border-radius:10px;background:#072035;max-width:85%;width:fit-content}
.Me{margin-left:auto;background:#0b3b55}
.bar{display:flex;gap:6px;padding:8px}
input{flex:1;min-width:0;background:#041424;border:1px solid #19d3ff;color:#fff;border-radius:8px;padding:10px;font-size:15px}
button{background:#0b3b55;border:1px solid #19d3ff;color:#9fe8ff;border-radius:8px;padding:10px;font-size:15px}
#set{display:none;padding:10px;border-top:1px solid #19d3ff}#set input{width:100%;box-sizing:border-box;margin:4px 0}
</style></head><body>
<div class="core"></div><h1>J.A.R.V.I.S.</h1>
<div id="log"><div class="m">হ্যালো আকাশ 👑 কী করতে পারি? ⚙ থেকে সেটআপ করুন।</div></div>
<div id="set">
<input id="k" placeholder="Gemini API key (aistudio.google.com, ফ্রি)">
<input id="m" placeholder="Model (gemini-2.5-flash)">
<input id="c" placeholder="Country code (ভারত 91, বাংলাদেশ 880)">
<button onclick="sv()">Save</button>
<button onclick="Android.settings('acc')">Accessibility চালু করুন</button>
<button onclick="Android.settings('notif')">Notification access চালু করুন</button>
</div>
<div class="bar"><input id="t" placeholder="কমান্ড লিখুন..."><button onclick="go()">▶</button><button onclick="Android.listen()">🎤</button><button onclick="tg()">⚙</button></div>
<script>
function log(w,t){var d=document.createElement('div');d.className='m '+w;d.textContent=t;var l=document.getElementById('log');l.appendChild(d);l.scrollTop=l.scrollHeight}
function go(){var t=document.getElementById('t');if(!t.value)return;log('Me',t.value);Android.cmd(t.value);t.value=''}
function tg(){var s=document.getElementById('set');s.style.display=s.style.display=='block'?'none':'block'}
function sv(){Android.save(k.value,m.value,c.value);log('J','Saved ✔');tg()}
try{var s=JSON.parse(Android.load());k.value=s.k;m.value=s.m;c.value=s.c}catch(e){}
</script></body></html>
